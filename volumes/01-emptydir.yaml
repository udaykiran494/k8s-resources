apiVersion: v1
kind: pod
metadata:
  name: empty-dir-demo
  namespace:  default
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
    
  - name: almalinux
    image: almalinux
    command: ["sleep","1000"] 
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
      readonly: true
  volumes:
    - name: nginx-logs
      emptyDir: 
        sizeLimit: 100mi